<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水晶花 · 不断绽放</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23060a10'/><path d='M16 3 L27 14 L16 29 L5 14 Z' fill='%238fe2ff' fill-opacity='.9'/><path d='M16 3 L16 29 M5 14 L27 14' stroke='%23060a10' stroke-width='1.4' stroke-opacity='.7'/></svg>">
<style>
  :root{
    --ink:#04070c;
    --ice:#dff2ff;
    --ice-dim:rgba(203,230,248,.40);
    --hair:rgba(178,214,238,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--ice);
    overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    touch-action:manipulation;
  }
  .fallback{
    position:fixed;inset:0;
    display:none;
    background:#04070c;
  }
  .fallback img{
    width:100%;height:100%;object-fit:contain;object-position:center;
  }

  .title{
    position:fixed;
    top:clamp(22px,5vh,54px);
    right:clamp(20px,3.2vw,46px);
    display:flex;align-items:flex-start;
    gap:12px;
    pointer-events:none;
    user-select:none;
  }
  .title .rule{
    width:1px;
    height:clamp(34px,7vh,64px);
    background:linear-gradient(to bottom,var(--hair),rgba(178,214,238,0));
    margin-top:2px;
  }
  .title .word{
    writing-mode:vertical-rl;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    font-size:clamp(15px,1.5vw,21px);
    letter-spacing:.42em;
    color:rgba(214,238,252,.48);
    line-height:1.1;
  }

  .bar{
    position:fixed;
    left:0;right:0;bottom:0;
    /* 底部留出平台水印的高度，避免控件被角标压住 */
    padding:0 clamp(18px,3vw,40px) clamp(50px,7vh,66px);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;
    pointer-events:none;
  }
  .bar .note{
    margin:0;
    font-size:13px;line-height:1.9;
    letter-spacing:.06em;
    color:var(--ice-dim);
    max-width:min(40ch,52vw);
  }
  .bar .acts{
    display:flex;gap:10px;
    pointer-events:auto;
    flex:0 0 auto;
  }
  button{
    -webkit-appearance:none;appearance:none;
    font:inherit;font-size:13px;
    letter-spacing:.08em;
    color:rgba(214,238,252,.62);
    background:rgba(12,22,32,.34);
    border:1px solid var(--hair);
    border-radius:2px;
    min-height:44px;
    padding:11px 16px;
    cursor:pointer;
    transition:color .25s ease,border-color .25s ease,background-color .25s ease;
  }
  button:hover{color:rgba(232,247,255,.92);border-color:rgba(178,214,238,.34);background:rgba(16,30,44,.5)}
  button:active{color:#fff;border-color:rgba(196,228,248,.5)}
  button:focus-visible{outline:2px solid rgba(143,226,255,.85);outline-offset:2px}
  button[disabled]{opacity:.4;cursor:default}

  /* ===== 开屏授权界面 ===== */
  .boot{
    position:fixed;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow:hidden;
    color:#17171a;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    background-color:#eceae5;
    background-image:
      radial-gradient(118% 96% at 50% 40%, #f7f6f2 0%, #eeede8 52%, #e6e5e0 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.014) 0 1px, rgba(0,0,0,0) 1px 33.333%);
    transition:opacity .45s ease;
  }
  .boot.is-out{opacity:0;pointer-events:none}
  .boot-scan{
    position:absolute;left:0;right:0;top:-30%;height:160%;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.94) 42%,rgba(23,23,26,.10) 56%,rgba(255,255,255,0));
  }
  .boot.is-granted .boot-scan{animation:bootScan .46s ease both}
  .boot.is-granted .boot-grant,
  .boot.is-granted .boot-hint{animation:none;opacity:0;transition:opacity .18s ease}
  @keyframes bootScan{
    0%{opacity:.85;transform:translateY(-52%)}
    100%{opacity:0;transform:translateY(52%)}
  }

  .boot-hud{
    position:absolute;left:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);top:clamp(16px,3vh,28px);
  }
  .boot-hud-row{
    display:flex;align-items:baseline;gap:12px;
    font-size:10.5px;letter-spacing:.17em;color:#33332f;
    animation:bootIn .5s ease .1s both;
  }
  .boot-clock{color:#bd6224;letter-spacing:.12em}
  .boot-bar{
    position:relative;width:158px;height:2px;margin-top:10px;
    background:rgba(23,23,26,.14);
    animation:bootIn .5s ease .16s both;
  }
  .boot-bar i{
    position:absolute;left:0;top:0;height:100%;width:0;
    background:#bd6224;
    transition:width 1.1s cubic-bezier(.2,.8,.3,1);
  }
  .boot-dots{
    display:flex;gap:5px;margin-top:9px;
    animation:bootIn .5s ease .22s both;
  }
  .boot-dots span{width:3px;height:3px;background:rgba(23,23,26,.30)}

  .boot-mid{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    max-width:min(860px,92vw);
  }
  .boot-title{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(27px,4.9vw,46px);
    letter-spacing:.30em;
    text-indent:.30em;
    line-height:1.2;
    color:#141416;
    animation:bootIn 1s cubic-bezier(.2,1,.3,1) .55s both;
  }
  .boot-sub{
    margin:clamp(10px,1.6vh,16px) 0 0;
    font-size:clamp(9.5px,1vw,11.5px);
    letter-spacing:.44em;
    text-indent:.44em;
    color:#71716b;
    animation:bootIn .8s ease .85s both;
  }
  .boot-rule{
    width:min(780px,88vw);height:1px;margin:clamp(12px,2vh,20px) 0 0;
    background:linear-gradient(90deg,rgba(23,23,26,0),rgba(23,23,26,.42) 16%,rgba(23,23,26,.42) 84%,rgba(23,23,26,0));
    animation:bootRule .9s cubic-bezier(.2,1,.3,1) .95s both;
  }
  @keyframes bootRule{
    0%{transform:scaleX(.04);opacity:.25}
    100%{transform:scaleX(1);opacity:1}
  }
  .boot-grant{
    margin-top:clamp(26px,4.2vh,40px);
    display:inline-flex;align-items:center;gap:14px;
    padding:9px 16px;
    font:inherit;font-size:clamp(13px,1.2vw,15px);
    color:#17171a;
    background:transparent;
    border:1px solid rgba(23,23,26,.52);
    border-radius:0;
    cursor:pointer;
    letter-spacing:.06em;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
    animation:bootIn .6s ease 1.2s both;
  }
  .boot-grant em{
    font-style:normal;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-weight:600;letter-spacing:.16em;
  }
  .boot-grant span{
    font-size:.72em;letter-spacing:.30em;opacity:.55;
  }
  .boot-grant:hover{background:#17171a;color:#f1f0eb;border-color:#17171a}
  .boot-grant:hover span{opacity:.7}
  .boot-grant:focus-visible{outline:2px solid #17171a;outline-offset:3px}
  .boot-hint{
    margin:clamp(12px,1.8vh,18px) 0 0;
    font-size:clamp(10px,1.1vw,12px);
    letter-spacing:.10em;
    color:#72726c;
    animation:bootIn .6s ease 1.45s both;
  }
  .boot-hint kbd{
    font:inherit;font-size:.94em;
    padding:1px 5px;margin:0 2px;
    border:1px solid rgba(23,23,26,.26);
    border-radius:2px;
  }

  .boot-foot{
    position:absolute;left:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);bottom:clamp(16px,3vh,28px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;
    font-size:10.5px;letter-spacing:.15em;color:#6d6d67;
    animation:bootIn .6s ease 1.6s both;
  }
  .boot-step{justify-self:start}
  .boot-step b{color:#1c1c1e;font-weight:600}
  .boot-wait{
    justify-self:center;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:clamp(11px,1.3vw,13.5px);
    letter-spacing:.08em;color:#2a2a2c;
  }
  .boot-wait em{
    display:block;margin-top:5px;
    font-style:normal;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    font-size:9px;letter-spacing:.28em;color:#7c7c76;
  }
  .boot-id{justify-self:end;text-align:right}
  .boot-id em{
    display:block;margin-top:5px;font-style:normal;font-size:9px;letter-spacing:.22em;color:#8a8a84;
  }

  @keyframes bootIn{
    0%{opacity:0;transform:translateY(6px)}
    100%{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    .boot{display:none}
  }

  /* ===== 访问密码 ===== */
  .lock{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:26px;
    background:
      radial-gradient(120% 85% at 50% 44%, rgba(10,20,32,.70), rgba(3,6,10,.97) 62%),
      #04070c;
    transition:opacity .5s ease;
  }
  .lock.is-open{opacity:0;pointer-events:none}
  .lock-inner{
    position:relative;z-index:1;
    width:min(340px,84vw);
    display:flex;flex-direction:column;gap:14px;
    opacity:0;transform:translateY(8px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .lock-rule{height:1px;background:linear-gradient(90deg,rgba(178,214,238,.36),rgba(178,214,238,0))}
  .lock-head{
    font-size:12.5px;letter-spacing:.28em;
    color:rgba(203,230,248,.54);
  }
  .lock-field{display:flex;gap:10px;align-items:stretch;margin:2px 0 0}
  .lock-field input{
    flex:1 1 auto;min-width:0;
    font:inherit;font-size:16px;
    letter-spacing:.32em;
    color:var(--ice);
    background:transparent;
    border:0;border-bottom:1px solid rgba(178,214,238,.30);
    border-radius:0;
    padding:11px 2px;
    -webkit-appearance:none;appearance:none;
  }
  .lock-field input::placeholder{color:rgba(203,230,248,.30);letter-spacing:.18em}
  .lock-field input:focus{outline:none;border-bottom-color:rgba(143,226,255,.72)}
  .lock-field input:focus-visible{outline:2px solid rgba(143,226,255,.55);outline-offset:3px}
  .lock-field button{flex:0 0 auto}
  .lock-tip{
    min-height:1.2em;margin:0;
    font-size:13px;line-height:1.5;letter-spacing:.05em;
    color:rgba(255,182,182,.78);
  }
  @keyframes lockShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(2px)}
  }
  .lock.shake .lock-inner{animation:lockShake .34s ease}
  @media (prefers-reduced-motion: reduce){
    .lock.shake .lock-inner{animation:none}
  }

  @media (max-width:520px){
    .bar{flex-direction:column;align-items:stretch;gap:14px}
    .bar .note{max-width:100%;font-size:12.5px}
    .acts{justify-content:flex-start}
    .lock-field{flex-direction:column;gap:12px}
    .lock-field button{width:100%}
    .boot-title{letter-spacing:.20em;text-indent:.20em}
    .boot-sub{letter-spacing:.30em;text-indent:.30em}
    .boot-foot{grid-template-columns:1fr;justify-items:center;gap:7px;font-size:9.5px;letter-spacing:.10em}
    .boot-step,.boot-id{justify-self:center;text-align:center}
    .boot-id{display:none}
  }
</style>
</head>
<body>
  <canvas id="stage" aria-label="不断绽放的水晶花"></canvas>
  <div class="fallback" id="fallback" aria-hidden="true">
    <img alt="水晶莲花">
  </div>

  <div class="title">
    <div class="rule"></div>
    <div class="word">水晶花</div>
  </div>

  <div class="bar">
    <p class="note" id="note">晶体在呼吸里一层层向外舒展，开盛、微收，再开一次。轻点画面，会让它开得更快。</p>
    <div class="acts">
      <button type="button" id="again">再开一次</button>
      <button type="button" id="toggle" aria-pressed="false">让花停下</button>
    </div>
  </div>

  <!-- ===== 开屏授权 ===== -->
  <div class="boot" id="boot">
    <div class="boot-scan" aria-hidden="true"></div>
    <div class="boot-hud">
      <div class="boot-hud-row">
        <span>REV 0.1.0 · WEB PROFILE</span>
        <span class="boot-clock" id="bootClock">00:00:00</span>
      </div>
      <div class="boot-bar"><i id="bootBar"></i></div>
      <div class="boot-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="boot-mid">
      <h1 class="boot-title">需要访问许可</h1>
      <p class="boot-sub">ACCESS PERMISSION REQUIRED</p>
      <div class="boot-rule"></div>
      <button type="button" class="boot-grant" id="bootGrant">
        <em>授予访问权限</em><span>GRANT ACCESS</span>
      </button>
      <p class="boot-hint">按 <kbd>Enter</kbd> / <kbd>Space</kbd>，或点击按钮继续</p>
    </div>

    <div class="boot-foot">
      <div class="boot-step">[ <b id="bootStep">01</b> / 06 ] AUTHORIZATION</div>
      <div class="boot-wait" id="bootWait">等待用户授权…<em>AWAITING OPERATOR CONSENT</em></div>
      <div class="boot-id">· ID CONFIRM<em>SYSTEM 0x1F4A</em></div>
    </div>
  </div>

  <!-- ===== 访问密码 ===== -->
  <div class="lock" id="lock">
    <div class="lock-inner" id="lockInner">
      <div class="lock-rule"></div>
      <div class="lock-head">请输入访问密码</div>
      <form class="lock-field" id="pwForm" autocomplete="off">
        <input id="pw" type="password" name="pw" inputmode="numeric" autocomplete="off" aria-label="访问密码" placeholder="密码">
        <button type="submit" id="pwGo">进入</button>
      </form>
      <p class="lock-tip" id="pwTip" role="status" aria-live="polite"></p>
    </div>
  </div>

<script>

  var btnToggle = document.getElementById('toggle');

  // 访问密码
  var lock = document.getElementById('lock');
  var lockInner = document.getElementById('lockInner');
  var pwForm = document.getElementById('pwForm');

  var pwTip = document.getElementById('pwTip');

  var unlocked = false;

    '  vec2 p = (vUv - 0.5) * vec2(aspect, 1.0) * zoom;',
    '  float r = length(p);',
    '  float ang = atan(p.y, p.x);',
    '  float t = uTime;',
    '  float burst = uBurst * uBurst;',
    '',
    '  // 冷蓝暗场',
    '  vec3 col = vec3(0.0048, 0.0092, 0.0172);',
    '  col += vec3(0.020, 0.070, 0.128) * exp(-r * 4.6);',
    '  col += vec3(0.042, 0.115, 0.205) * exp(-r * 1.9) * 0.34;',
    '',
    '  // 晶体后方的细光带',
    '  float rays = pow(abs(cos(ang * 12.0 + t * 0.05)), 40.0);',
    '  col += vec3(0.10, 0.22, 0.36) * rays * exp(-r * 2.4) * 0.09;',
    '',
    '  // 冰屑',
    '  float bmask = smoothstep(0.04, 0.22, r) * smoothstep(0.98, 0.44, r);',
    '  col += vec3(0.28, 0.56, 0.90) * bokeh(p, 7.0, t) * bmask * 0.11;',
    '  col += vec3(0.45, 0.75, 1.00) * bokeh(p * 1.6 + 5.2, 13.0, t * 1.3) * bmask * 0.06;',
    '  float smask = smoothstep(0.02, 0.10, r) * smoothstep(0.95, 0.40, r);',
    '  col += vec3(0.58, 0.82, 1.00) * shard(p, 5.5, t) * smask * 0.85;',
    '  col += vec3(0.70, 0.88, 1.00) * shard(p * 1.45 + 21.7, 9.0, t * 1.2) * smask * 0.45;',
    '',
    '  // 生长节拍：整朵外扩 / 微收，每片花瓣相位略有先后',
    '  float bloom = 0.5 - 0.5 * cos(t * 0.16);',
    '  float sc = 0.940 + 0.105 * bloom + 0.16 * burst;',
    '  float sway = sin(ang * 8.0 + t * 0.42) * 0.5 + sin(ang * 5.0 - t * 0.26) * 0.5;',
    '',
    '  vec2 sp = p / sc;',
    '  sp *= 1.0 - 0.020 * sway;',
    '  sp = rot(sp, 0.05 * sin(t * 0.11) + 0.012 * t);',
    '',
    '  // 由花心向外推的光波',
    '  float rip = sin(r * 26.0 - t * 1.9);',
    '  vec2 dir = normalize(p + 1e-6);',
    '  sp += dir * 0.0042 * rip;',
    '',
    '  float K = 1.18;',
    '  vec2 uv0 = 0.5 + sp * K;',
    '',
    '  // 棱边色散：沿径向错开取样',
    '  vec2 cd = dir * 0.0024;',
    '  vec3 fl = vec3(',
    '    texture2D(uTex, 0.5 + (sp + cd) * K).r,',
    '    texture2D(uTex, uv0).g,',
    '    texture2D(uTex, 0.5 + (sp - cd) * K).b',
    '  );',
    '',
    '  // 花瓣辉光',
    '  float ho = 0.0060;',
    '  vec3 halo = vec3(0.0);',
    '  halo += texture2D(uTex, 0.5 + (sp + vec2(ho, 0.0)) * K).rgb;',
    '  halo += texture2D(uTex, 0.5 + (sp - vec2(ho, 0.0)) * K).rgb;',
    '  halo += texture2D(uTex, 0.5 + (sp + vec2(0.0, ho)) * K).rgb;',
    '  halo += texture2D(uTex, 0.5 + (sp - vec2(0.0, ho)) * K).rgb;',
    '  halo *= 0.25;',
    '',
    '  // 外瓣在盛开时更亮，光波经过时轻微过曝',
    '  float outer = smoothstep(0.10, 0.48, r);',
    '  fl *= 1.0 + 0.42 * bloom * outer;',
    '  fl *= 1.0 + 0.13 * rip * exp(-r * 3.0);',
    '  fl *= 1.0 + 0.40 * burst;',
    '',
    '  col += fl + halo * 0.42;',
    '  col += vec3(0.62, 0.86, 1.00) * exp(-r * 3.0) * 0.10 * bloom;',
    '  col += vec3(0.82, 0.95, 1.00) * exp(-r * 34.0) * 0.20 * (0.65 + 0.35 * sin(t * 1.3));',
    '',
    '  // 点击迸发',
    '  col += vec3(0.50, 0.80, 1.00) * burst * 0.22 * exp(-r * 2.6);',
    '',
    '  col *= 1.0 - 0.50 * smoothstep(0.50, 1.15, r);',
    '  col += (hash21(vUv * uRes + t * 7.0) - 0.5) * 0.008;',
    '  col = max(col, 0.0);',
    '  col = 1.0 - exp(-col * 1.22);',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  var gl = null, prog = null, loc = {}, texReady = false;
  var raf = 0, lastT = 0;
  var state = { time: 0, burst: 0, paused: false };
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh) || 'shader compile failed');
    }
    return sh;
  }

  function initGL() {
    try {
      gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' })
        || canvas.getContext('experimental-webgl');
      if (!gl) throw new Error('no webgl');

      var vs = compile(gl.VERTEX_SHADER, VERT);
      var fs = compile(gl.FRAGMENT_SHADER, FRAG);
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog) || 'program link failed');
      }
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      loc.uRes = gl.getUniformLocation(prog, 'uRes');
      loc.uTime = gl.getUniformLocation(prog, 'uTime');
      loc.uBurst = gl.getUniformLocation(prog, 'uBurst');
      loc.uTex = gl.getUniformLocation(prog, 'uTex');
      return true;
    } catch (err) {
      gl = null;
      return false;
    }
  }

  function loadTexture() {
    var img = new Image();
    img.onload = function () {
      var tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      var pot = (img.width & (img.width - 1)) === 0 && (img.height & (img.height - 1)) === 0;
      if (pot) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.uniform1i(loc.uTex, 0);
      texReady = true;
      draw();
    };
    img.onerror = function () {
      fallback.style.display = 'block';
      canvas.style.display = 'none';
    };
    img.src = TEX;
  }

  function draw() {
    if (!gl || !texReady) return;
    gl.uniform1f(loc.uTime, state.time);
    gl.uniform1f(loc.uBurst, state.burst);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(window.innerWidth * dpr);
    var h = Math.round(window.innerHeight * dpr);
    var maxPx = 2600000;
    if (w * h > maxPx) {
      var s = Math.sqrt(maxPx / (w * h));
      w = Math.max(1, Math.round(w * s));
      h = Math.max(1, Math.round(h * s));
    }
    canvas.width = w;
    canvas.height = h;
    if (gl) {
      gl.viewport(0, 0, w, h);
      gl.uniform2f(loc.uRes, w, h);
      draw();
    }
  }

  function start() {
    if (!unlocked || !gl || raf) return;
    lastT = 0;
    raf = requestAnimationFrame(tick);
  }

  function stop() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function tick(now) {
    raf = 0;
    if (!lastT) lastT = now;
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (!state.paused) state.time += dt;
    if (state.burst > 0) state.burst = Math.max(0, state.burst - dt * 0.55);

    draw();

    if (!state.paused || state.burst > 0) {
      raf = requestAnimationFrame(tick);
    }
  }

  function setPaused(v) {
    state.paused = v;
    btnToggle.setAttribute('aria-pressed', String(v));
    btnToggle.textContent = v ? '让它继续' : '让花停下';
    start();
  }

  function burst() {
    if (!gl) return;
    state.burst = 1;
    start();
  }

  btnAgain.addEventListener('click', burst);
  btnToggle.addEventListener('click', function () { setPaused(!state.paused); });

  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    burst();
  });

  document.addEventListener('keydown', function (e) {
    if (!unlocked) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    var ae = document.activeElement;
    if (ae === btnAgain || ae === btnToggle) return;
    e.preventDefault();
    burst();
  });

  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    stop();
    fallback.style.display = 'block';
    canvas.style.display = 'none';
  });

  var glOk = initGL();
  if (glOk) {
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    if (reduceMQ.matches) {
      state.paused = true;
      btnToggle.setAttribute('aria-pressed', 'true');
      btnToggle.textContent = '让它继续';
    }

    loadTexture();
  } else {
    fallback.style.display = 'block';
    canvas.style.display = 'none';
    btnAgain.disabled = true;
    btnToggle.disabled = true;
  }

  // 开锁
  function unlock() {
    if (unlocked) return;
    if (pwInput.value !== PASS) {
      pwTip.textContent = '密码不正确，请重试';
      pwInput.value = '';
      pwInput.focus();
      lock.classList.remove('shake');
      void lock.offsetWidth;
      lock.classList.add('shake');
      return;
    }
    unlocked = true;
    pwTip.textContent = '';
    lock.classList.add('is-open');
    window.setTimeout(function () {
      if (lock && lock.parentNode) lock.parentNode.removeChild(lock);
    }, 620);
    if (glOk) start();
  }

  pwForm.addEventListener('submit', function (e) {
    e.preventDefault();
    unlock();
  });


  // 开屏：系统授权界面
  (function boot() {
    var el = document.getElementById('boot');
    var grant = document.getElementById('bootGrant');
    var bar = document.getElementById('bootBar');
    var step = document.getElementById('bootStep');
    var clockEl = document.getElementById('bootClock');
    var waitEl = document.getElementById('bootWait');
    var revealed = false, gone = false, ct = 0;

    function revealLock() {
      if (revealed) return;
      revealed = true;
      lockInner.style.opacity = '1';
      lockInner.style.transform = 'none';
      try { pwInput.focus(); } catch (err) {}
    }

    function dropBoot() {
      if (!el || !el.parentNode) return;
      el.parentNode.removeChild(el);
      el = null;
    }

    if (!el || reduceMQ.matches) {
      dropBoot();
      revealLock();
      return;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tickClock() {
      var d = new Date();
      clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tickClock();
    ct = window.setInterval(tickClock, 1000);

    window.setTimeout(function () { bar.style.width = '34%'; }, 160);

    function grantAccess() {
      if (gone) return;
      gone = true;
      window.clearInterval(ct);
      el.classList.add('is-granted');
      bar.style.width = '100%';
      step.textContent = '06';
      waitEl.innerHTML = '已授予访问权限<em>ACCESS GRANTED</em>';
      document.removeEventListener('keydown', onKey, true);
      window.setTimeout(function () {
        el.classList.add('is-out');
        revealLock();
      }, 380);
      window.setTimeout(dropBoot, 1050);
    }

    function onKey(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        grantAccess();
      }
    }

    grant.addEventListener('click', grantAccess);
    document.addEventListener('keydown', onKey, true);
  })();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (unlocked && (!state.paused || state.burst > 0)) start();
  });
})();
</script>
</body>
</html>
